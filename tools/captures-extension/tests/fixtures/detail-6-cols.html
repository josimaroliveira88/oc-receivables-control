<!doctype html>
<!--
  Fixture based on the real OrderInvoice HTML of pedido 176348264 ("Camilo
  Santos, Thatiane" — Brazilian consultant). The items table has 6 columns
  (no PV column) because the order is a BOGO promo bundle. This is the case
  the previous parser missed: every item row fell into the
  `cells.length < 7` continue and the import failed with "Sem itens no
  detalhe" for this user.
-->

  <head>
    <title>Detalhes do Pedido</title>
  </head>
  <body>
    <div class="ui basic segment tabledivnm">
      <table class="ui striped unstackable table bigEVOTable celled evotable">

          <tr class="InvoiceHeader">
            <th class="center aligned">Item</th>
            <th class="center aligned">Qtde enviada</th>
            <th class="center aligned">Qtde encomendada</th>
            <th>Descrição</th>
            <th class="right aligned">Preço</th>
            <th class="right aligned">Preço total</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="center aligned">3909</td>
            <td class="center aligned">4</td>
            <td class="center aligned">4</td>
            <td>BOGO 2 - Dia 1<br /></td>
            <td class="right aligned">R$ 199.00</td>
            <td class="right aligned">R$ 796.00</td>
          </tr>
          <tr align="center">
            <td colspan="4">&nbsp;</td>
            <td colspan="2" class="right aligned">
              <b>Subtotal:</b> R$ 796.00
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ui mobile reversed stackable grid nomargin">
      <div class="six wide tablet five wide computer column">
        <table class="ui very compact very basic unstackable table">
          <tr>
            <td><b>Frete</b> (Envio Normal)</td>
            <td class="right aligned">R$ 15.90</td>
          </tr>
          <tr>
            <td><b>Imposto</b> 0%</td>
            <td class="right aligned">R$ 0.00</td>
          </tr>
          <tr>
            <td><b>Total a Pagar</b></td>
            <td class="right aligned">R$ 811.90</td>
          </tr>
        </table>
      </div>
    </div>

    <div class="ui right floated compact basic segment nomargin">
      <table class="ui very compact very basic collapsing unstackable table">
        <tr>
          <td colspan="2" class="center aligned InvoicePayments">
            Tipo de Pagamento
          </td>
        </tr>
        <tr>
          <td><b>Tipo de Pagamento</b></td>
          <td class="right aligned">Boleto</td>
        </tr>
        <tr>
          <td><b>Valor recibo:</b></td>
          <td class="right aligned">811.90</td>
        </tr>
        <tr>
          <td><b>Total</b></td>
          <td class="right aligned">811.90</td>
        </tr>
        <tr>
          <td><b>A Receber</b></td>

        </tr>
      </table>

  </body>
</html>
