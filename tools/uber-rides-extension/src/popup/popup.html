<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 280px;
        font:
          13px/1.45 system-ui,
          sans-serif;
        background: #fff;
        color: #111;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 12px 12px 8px;
        font-weight: 600;
      }
      header span {
        font-size: 10px;
        color: #999;
        font-weight: 400;
      }
      main {
        padding: 0 12px 12px;
      }
      p {
        margin: 0 0 10px;
        min-height: 32px;
        font-size: 12px;
        color: #555;
      }
      p[data-kind='ok'] {
        color: #2f9e44;
      }
      p[data-kind='warn'] {
        color: #d6336c;
      }
      label {
        display: block;
        font-size: 11px;
        color: #666;
        margin: 0 0 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 12px;
      }
      h4 {
        margin: 10px 0 6px;
        font-size: 12px;
        color: #444;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 13px;
      }
      button + button {
        margin-top: 6px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #capture {
        background: #d6336c;
        color: #fff;
      }
      #save {
        background: #1c7ed6;
        color: #fff;
      }
      #open {
        background: #f1f3f5;
        color: #111;
      }
      #open-doterra {
        background: #f1f3f5;
        color: #111;
      }
      #open-app {
        background: #f1f3f5;
        color: #111;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Capturas — Uber & dōTERRA</strong>
      <span id="version"></span>
    </header>
    <main>
      <p id="status" data-kind="info">Verificando…</p>
      <button id="capture" type="button" disabled>Capturar agora</button>
      <button id="open" type="button">Abrir riders.uber.com</button>
      <button id="open-doterra" type="button">Abrir pedidos dōTERRA</button>

      <h4>Integração com o app</h4>
      <label for="token">Token de acesso</label>
      <input id="token" type="password" placeholder="cr_…" spellcheck="false" />
      <p id="token-status" style="min-height: 16px; margin-bottom: 6px"></p>
      <label for="server">Servidor do app</label>
      <input
        id="server"
        type="url"
        placeholder="http://localhost:3000"
        spellcheck="false"
      />
      <button id="save" type="button">Salvar</button>
      <button id="open-app" type="button">
        Abrir o app para gerar o token
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
